name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install zsh (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y zsh

      - name: zsh -n (syntax check, plugin)
        run: zsh -n zsh-aws.plugin.zsh

      - name: zsh -n (syntax check, bundled completer)
        run: zsh -n bin/aws_zsh_completer.sh

      - name: Run test suite
        run: zsh test/run-tests.zsh
