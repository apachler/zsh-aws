name: link-check

on:
  push:
    branches: [main]
  pull_request:
    paths: ['**/*.md']
  schedule:
    # Catch link rot weekly. README links to AWS docs, oh-my-zsh, the Zsh
    # Plugin Standard, etc. — none under our control.
    - cron: '0 6 * * 1'

permissions:
  contents: read

jobs:
  link-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: gaurav-nelson/github-action-markdown-link-check@v1
        with:
          use-quiet-mode: 'yes'
          use-verbose-mode: 'yes'
          config-file: .github/link-check-config.json
