name: link-check

on:
  push:
    branches: [main]
  pull_request:
    paths: ['**/*.md']
  schedule:
    # Catch link rot weekly. README links to AWS docs, oh-my-zsh, the Zsh
    # Plugin Standard, etc. — none under our control.
    - cron: '0 6 * * 1'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  link-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: gaurav-nelson/github-action-markdown-link-check@5c5dfc0ac2e225883c0e5f03a85311ec2830d368 # v1.0.17
        with:
          use-quiet-mode: 'yes'
          use-verbose-mode: 'yes'
          config-file: .github/link-check-config.json
