name: Bug report
description: Something behaves differently than the README or docstrings claim.
title: "[bug] "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for filing a report. Please fill the sections below so we can reproduce quickly.
        If this might be a security issue, **do not** file it here — see [SECURITY.md](../SECURITY.md).
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: One or two sentences describing the bug.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction steps
      description: Minimal steps to reproduce. Include the exact command(s) and any relevant `~/.aws/config` profile shape (sanitized).
      placeholder: |
        1. `acp my-profile`
        2. ...
        3. Observed: ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: input
    id: zsh-version
    attributes:
      label: Zsh version
      description: Output of `zsh --version`.
      placeholder: "zsh 5.9 (x86_64-pc-linux-gnu)"
    validations:
      required: true
  - type: input
    id: aws-cli-version
    attributes:
      label: AWS CLI version
      description: Output of `aws --version`.
      placeholder: "aws-cli/2.17.0 Python/3.12.5 ..."
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS
      placeholder: "Ubuntu 24.04 / macOS 15.0 / ..."
    validations:
      required: true
  - type: input
    id: plugin-manager
    attributes:
      label: Plugin manager
      placeholder: "oh-my-zsh / zinit / antidote / sheldon / manual / ..."
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: zsh-aws version / commit
      description: Tag or `git rev-parse HEAD` of your local checkout.
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Additional context
      description: Logs, screenshots, theme, anything that might matter. **Never paste real access keys or session tokens.**
